<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SR-A // STALKER ARCHIVE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0c12, #030507);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', 'Fira Code', 'Courier New', monospace;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;   /* убираем горизонтальную прокрутку */
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(circle at 20% 30%, rgba(0, 255, 170, 0.02) 0px, rgba(0, 0, 0, 0.2) 2px);
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 170, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 170, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .terminal {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            width: 100%;
            background: rgba(8, 12, 18, 0.85);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0, 255, 170, 0.4);
            border-radius: 28px;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.15), inset 0 0 15px rgba(0, 255, 170, 0.05);
            padding: 1.8rem 2rem 2rem 2rem;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        .terminal::before,
        .terminal::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: #0fa;
            border-style: solid;
            filter: drop-shadow(0 0 4px #0fa);
        }

        .terminal::before {
            top: 12px;
            left: 12px;
            border-top-width: 2px;
            border-left-width: 2px;
            border-right: none;
            border-bottom: none;
        }

        .terminal::after {
            bottom: 12px;
            right: 12px;
            border-bottom-width: 2px;
            border-right-width: 2px;
            border-left: none;
            border-top: none;
        }

        .protocol-grid {
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            gap: 2rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        .user-panel {
            background: rgba(0, 20, 15, 0.4);
            border-left: 3px solid #0fa;
            padding: 1rem 0 1rem 1.5rem;
        }

        .user-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #6fcf97;
            margin-bottom: 0.5rem;
        }

        .user-name {
            font-size: 2.2rem;
            font-weight: 500;
            color: #ccffdd;
            text-shadow: 0 0 8px #0fa;
        }

        .user-name span {
            color: #0fa;
            font-weight: bold;
        }

        .metric-panel {
            background: rgba(0, 20, 15, 0.3);
            padding: 1rem 1.5rem;
            border-right: 3px solid #0fa;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .archive-text {
            font-size: 2.7rem;
            font-weight: 700;
            font-family: 'CourierNewPSMT', 'Courier New', 'Courier', monospace;
            color: #d81b60;
            text-shadow: 0 0 15px #b0124a, 0 0 30px #8b0a3a, 0 0 45px #d81b60;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulseCrimsonGlow 1.8s infinite alternate;
        }

        @keyframes pulseCrimsonGlow {
            0% {
                text-shadow: 0 0 5px #b0124a, 0 0 10px #8b0a3a;
                opacity: 0.9;
            }
            100% {
                text-shadow: 0 0 20px #f06292, 0 0 35px #d81b60, 0 0 50px #b0124a;
                opacity: 1;
            }
        }

        .protocol-status {
            margin: 2rem 0 1.8rem;
            background: #030b0a70;
            padding: 1rem 1.5rem;
            border: 1px dashed #0fa;
            border-radius: 14px;
            backdrop-filter: blur(3px);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-x: hidden;
        }

        .protocol-status.expand-effect {
            border: 1px solid #0fa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.5), inset 0 0 8px rgba(0, 255, 170, 0.2);
            background: #0a1f1a90;
            transition: all 0.35s ease-out;
        }

        .scan-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scan-button {
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Share Tech Mono', 'Fira Code', monospace;
            background: rgba(10, 40, 30, 0.7);
            backdrop-filter: blur(4px);
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid #0fa;
            color: #0fa;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.4);
        }

        .scan-button:hover:not(:disabled) {
            background: #0fa22a30;
            border-color: #ff66aa;
            color: #ff88cc;
            box-shadow: 0 0 16px #0fa, 0 0 10px #ff66aa;
            transform: scale(1.02);
        }

        .scan-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-area {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .progress-label {
            font-size: 0.7rem;
            color: #8fcca5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-bar-bg {
            background: #13241f;
            border-radius: 20px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            box-shadow: inset 0 0 4px #000;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0fa, #6fcf97);
            border-radius: 20px;
            box-shadow: 0 0 6px #0fa;
            transition: width 0.1s linear;
        }

        .double-gamma {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 8px;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow-x: hidden;
        }

        .double-gamma.visible {
            display: flex;
            opacity: 1;
            transform: scaleY(1);
        }

        .windows-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            width: 100%;
        }

        .unified-frame {
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #8b0000;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 280px;
            backdrop-filter: blur(4px);
            animation: fadeInScale 0.5s ease forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        .unified-frame.troy-frame {
            background: rgba(40, 40, 45, 0.85);
            border-color: rgb(181, 181, 181);
            box-shadow: 0 0 20px rgba(181, 181, 181, 0.5);
        }

        .frame-image {
            width: 220px;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            border: 2px solid #b00030;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .troy-frame .frame-image {
            border-color: rgb(181, 181, 181);
            box-shadow: 0 0 12px rgba(181, 181, 181, 0.6);
        }

        .frame-button {
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Share Tech Mono', 'Fira Code', monospace;
            background: rgba(80, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            padding: 10px 24px;
            min-width: 140px;
            border-radius: 60px;
            border: 1px solid #cc3355;
            color: #ffcccc;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.7);
        }

        .troy-frame .frame-button {
            background: rgba(100, 100, 110, 0.9);
            border-color: rgb(181, 181, 181);
            color: #eeeeee;
            box-shadow: 0 0 8px rgba(181, 181, 181, 0.6);
        }

        .troy-frame .frame-button:hover {
            background: rgb(181, 181, 181);
            border-color: #ffffff;
            color: #222222;
            box-shadow: 0 0 16px rgb(181, 181, 181);
        }

        .frame-button:hover {
            background: rgba(139, 0, 0, 1);
            border-color: #ff8888;
            color: #ffffff;
            box-shadow: 0 0 16px #8b0000;
            transform: scale(1.02);
        }

        .report-section {
            width: 80%;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .report-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #0fa, #0fa, transparent);
            margin: 0;
            box-shadow: 0 0 4px #0fa;
        }

        .report-button {
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Share Tech Mono', 'Fira Code', monospace;
            background: rgba(20, 30, 25, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid #0fa;
            color: #9effcf;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 6px rgba(0, 255, 170, 0.4);
            animation: fadeInScale 0.5s ease 0.45s forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        .report-button:hover {
            background: #0fa22a30;
            border-color: #ff66aa;
            color: #ffccdd;
            box-shadow: 0 0 14px #0fa;
            transform: scale(1.02);
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .double-gamma.visible .unified-frame:first-child {
            animation-delay: 0.1s;
        }
        .double-gamma.visible .unified-frame:last-child {
            animation-delay: 0.25s;
        }
        .double-gamma.visible .report-button {
            animation-delay: 0.45s;
        }

        .footer-status {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 255, 170, 0.4);
        }

        .sys-badge {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #0fa, #3effb3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 6px #0fa;
        }

        .info-tag {
            font-size: 0.8rem;
            color: #9befc4;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .info-tag span {
            border-left: 2px solid #0fa;
            padding-left: 10px;
        }

        /* Адаптивность */
        @media (max-width: 760px) {
            .terminal { padding: 1.2rem; }
            .protocol-grid { grid-template-columns: 1fr; gap: 1rem; }
            .user-name { font-size: 1.6rem; }
            .archive-text { font-size: 1.8rem; }
            .frame-image { width: 200px; }
            .unified-frame { max-width: 260px; }
            .report-section { width: 90%; }
            .report-button {
                padding: 6px 18px;
                font-size: 0.8rem;
            }
        }

        .hud-corner {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 0.65rem;
            color: #2f8b6b;
            z-index: 20;
            background: rgba(0,0,0,0.4);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Major+Mono+Display&display=swap" rel="stylesheet">
</head>
<body>
<div class="terminal">
    <div class="protocol-grid">
        <div class="user-panel">
            <div class="user-label">// идентификация</div>
            <div class="user-name">USER: <span>UNKNOWN</span></div>
        </div>
        <div class="metric-panel">
            <div class="archive-text">STALKER ARCHIVE</div>
        </div>
    </div>

    <div class="protocol-status" id="protocolStatus">
        <div class="scan-row">
            <button class="scan-button" id="scanBtn">[Сканировать]</button>
        </div>
        <div class="progress-area" id="progressArea">
            <div class="progress-label">⟳ АНАЛИЗ СИСТЕМЫ ⟳</div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div class="double-gamma" id="doubleGamma">
            <div class="windows-container">
                <div class="unified-frame troy-frame">
                    <img class="frame-image" src="https://i.pinimg.com/736x/4b/18/54/4b185430de503eb4ea4f9ed42826385b.jpg" alt="Troy">
                    <button class="frame-button" id="troyBtn">[Трой]</button>
                </div>
                <div class="unified-frame">
                    <img class="frame-image" src="https://i.pinimg.com/736x/f2/9f/16/f29f16c1d9ff46456f327f3a18abdc89.jpg" alt="Stalker">
                    <button class="frame-button" id="stalkerBtn">[Сталкер]</button>
                </div>
            </div>
            <div class="report-section">
                <div class="report-divider"></div>
                <button class="report-button" id="reportBtn">[Отчёт #95]</button>
            </div>
        </div>
    </div>

    <div class="footer-status">
        <div class="sys-badge">⚙️ SR-A</div>
        <div class="info-tag">
            <span>PROTOCOL: v.82.0_alpha</span>
            <span>ENCRYPT: ACTIVE</span>
            <span id="uptimeDisplay">UPTIME: 00:00:00</span>
        </div>
    </div>
    <div class="hud-corner">[ SECURE TERMINAL | SYS_ID: SR-A | STALKER ARCHIVE ]</div>
</div>

<script>
    (function() {
        const scanBtn = document.getElementById('scanBtn');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const doubleGamma = document.getElementById('doubleGamma');
        const troyBtn = document.getElementById('troyBtn');
        const stalkerBtn = document.getElementById('stalkerBtn');
        const reportBtn = document.getElementById('reportBtn');
        const protocolStatus = document.getElementById('protocolStatus');
        const archiveElement = document.querySelector('.archive-text');

        let scanning = false;
        let animationFrame = null;
        let startTime = 0;
        const animDuration = 2000;

        function resetScanState(resetButton = true) {
            if (animationFrame) cancelAnimationFrame(animationFrame);
            scanning = false;
            progressArea.style.display = 'none';
            doubleGamma.classList.remove('visible');
            doubleGamma.style.display = 'none';
            progressFill.style.width = '0%';
            if (resetButton) {
                scanBtn.disabled = false;
                scanBtn.textContent = '[Сканировать]';
            }
            protocolStatus.classList.remove('expand-effect');
        }

        function startProgressAnimation() {
            return new Promise((resolve) => {
                startTime = performance.now();
                progressFill.style.width = '0%';
                function update(currentTime) {
                    const elapsed = currentTime - startTime;
                    let percent = Math.min(1, elapsed / animDuration);
                    progressFill.style.width = `${percent * 100}%`;
                    if (percent < 1) animationFrame = requestAnimationFrame(update);
                    else { animationFrame = null; resolve(); }
                }
                animationFrame = requestAnimationFrame(update);
            });
        }

        async function onScanClick() {
            if (scanning) return;
            resetScanState(true);
            scanning = true;
            scanBtn.disabled = true;
            scanBtn.textContent = '[СКАНИРОВАНИЕ...]';
            progressArea.style.display = 'flex';
            doubleGamma.classList.remove('visible');
            doubleGamma.style.display = 'none';
            
            await new Promise(r => setTimeout(r, 30));
            await startProgressAnimation();
            
            progressArea.style.display = 'none';
            
            protocolStatus.classList.add('expand-effect');
            await new Promise(r => setTimeout(r, 150));
            
            doubleGamma.style.display = 'flex';
            doubleGamma.offsetHeight;
            doubleGamma.classList.add('visible');
            
            setTimeout(() => {
                protocolStatus.classList.remove('expand-effect');
            }, 800);
            
            if (archiveElement) {
                archiveElement.style.textShadow = '0 0 25px #f06292, 0 0 45px #d81b60';
                setTimeout(() => archiveElement.style.textShadow = '', 500);
            }
            
            scanning = false;
            scanBtn.disabled = false;
            scanBtn.textContent = '[Сканировать]';
            console.log(`[СКАНИРОВАНИЕ ЗАВЕРШЕНО] Эффект сканирующей линии удалён.`);
        }

        if (troyBtn) {
            troyBtn.addEventListener('click', () => {
                console.log(`[ТРОЙ] Переход на Troy.html`);
                if (archiveElement) {
                    archiveElement.style.animation = 'none';
                    archiveElement.style.textShadow = '0 0 35px #ff66aa, 0 0 60px #d81b60';
                    setTimeout(() => archiveElement.style.animation = 'pulseCrimsonGlow 1.8s infinite alternate', 200);
                }
                setTimeout(() => window.location.href = "Troy.html", 150);
            });
        }

        if (stalkerBtn) {
            stalkerBtn.addEventListener('click', () => {
                console.log(`[СТАЛКЕР] Переход на Stalker.html`);
                if (archiveElement) {
                    archiveElement.style.animation = 'none';
                    archiveElement.style.textShadow = '0 0 35px #ff66aa, 0 0 60px #d81b60';
                    setTimeout(() => archiveElement.style.animation = 'pulseCrimsonGlow 1.8s infinite alternate', 200);
                }
                setTimeout(() => window.location.href = "Stalker.html", 150);
            });
        }

        if (reportBtn) {
            reportBtn.addEventListener('click', () => {
                console.log(`[ОТЧЁТ #95] Переход на Report95.html`);
                if (archiveElement) {
                    archiveElement.style.animation = 'none';
                    archiveElement.style.textShadow = '0 0 35px #ffcc00, 0 0 60px #ffaa33';
                    setTimeout(() => archiveElement.style.animation = 'pulseCrimsonGlow 1.8s infinite alternate', 200);
                }
                setTimeout(() => window.location.href = "Report95.html", 150);
            });
        }

        if (scanBtn) scanBtn.addEventListener('click', onScanClick);

        const startTimeUptime = Date.now();
        const uptimeElement = document.getElementById('uptimeDisplay');
        function updateUptime() {
            const elapsed = Math.floor((Date.now() - startTimeUptime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            uptimeElement.textContent = `UPTIME: ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        }
        updateUptime();
        setInterval(updateUptime, 1000);

        const originalTitle = "SR-A // STALKER ARCHIVE";
        document.title = originalTitle;
        setInterval(() => {
            if (Math.random() > 0.88) {
                document.title = "> " + originalTitle + " _";
                setTimeout(() => document.title = originalTitle, 400);
            }
        }, 4000);

        console.log("%c[SR-A] Эффект бегущей линии полностью убран. Интерфейс статичен.", "color:#88ffaa");
    })();
</script>
</body>
</html>
